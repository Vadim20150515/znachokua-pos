<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каса — ЗначокUA</title>
<style>
:root{--sb1:#0b1020;--sb2:#1a1650;--bg:#eef0f7;--bd:#e4e7f0;--mu:#6b7280;--ok:#16a34a;--no:#dc2626;--ac:#6366f1;--sh:0 1px 2px #0000000d,0 10px 30px #312e810d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:radial-gradient(900px 520px at 88% -8%,#dfe5ff,transparent 60%),radial-gradient(760px 460px at -8% 108%,#f6e3ff,transparent 58%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:#fff;padding:8px 13px;border-radius:11px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px #312e8118;border-color:#c7cdf5}
button:active:not(:disabled){transform:scale(.97)}
button.k{background:linear-gradient(135deg,#111827,#3730a3);color:#fff;border-color:transparent}
button.g{background:linear-gradient(135deg,#16a34a,#0d9488);color:#fff;border-color:transparent}
button.r{color:var(--no)}button:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:9px 11px;border:1px solid var(--bd);border-radius:11px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #6366f126}
.auth{max-width:380px;margin:9vh auto;background:#ffffffee;border:1px solid var(--bd);border-radius:20px;padding:30px;box-shadow:0 24px 70px #312e8128;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.auth h2{margin:0 0 4px}.auth input,.auth button.k{margin-top:10px}.auth button.k{width:100%;padding:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#14b8a6);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 18px #22c55e55;flex:none}
#app{display:flex;min-height:100vh}
#side{width:262px;background:linear-gradient(180deg,var(--sb1),var(--sb2));color:#cbd5e1;padding:16px 12px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .top{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:16px;margin:2px 4px 16px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;color:#cbd5e1;padding:11px 12px;margin:2px 0}
.nv:hover:not(:disabled){background:#ffffff14;transform:translateX(3px);box-shadow:none;color:#fff;border:0}
.nv.on,.nv.on:hover:not(:disabled){background:linear-gradient(135deg,#fff,#eef0ff);color:#111827;font-weight:600;box-shadow:0 8px 22px #0006;transform:none}
.nv.ing{background:#ffffff0f;color:#fff}.nv i{font-style:normal;margin-right:9px}.nv em{float:right;font-style:normal;opacity:.55}
.sub{padding-left:12px;margin-left:10px;border-left:1px solid #ffffff22;animation:dd .22s ease}.sub .nv{padding:8px 12px;font-size:13px}.me{margin:18px 8px 0;font-size:12px;opacity:.7}
#main{flex:1;padding:24px;min-width:0}#main>:not(#burger){animation:up .38s cubic-bezier(.2,.8,.2,1) both}#burger{display:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes dd{from{opacity:0;transform:translateY(-6px)}}@keyframes pop{from{opacity:0;transform:scale(.94)}}@keyframes fade{from{opacity:0}}
@media(max-width:800px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .25s;box-shadow:12px 0 40px #0006}#side.o{transform:none}#burger{display:inline-block;margin-bottom:10px}#main{padding:14px}}
h2{margin:0 0 14px;font-size:24px;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0}
.card,.box{background:#ffffffeb;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.card{transition:transform .2s,box-shadow .2s;animation:up .45s both}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px #312e8120}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
.card b{display:block;font-size:24px;margin-top:4px;background:linear-gradient(135deg,#111827,#4338ca);-webkit-background-clip:text;background-clip:text;color:transparent}.card span{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 350px;gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-size:12px;font-weight:600}.w{overflow-x:auto}
tr{transition:background .15s}tr:hover td{background:#f6f7ff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>.gr{flex:1}.row>input,.row>select{width:auto}.mu{color:var(--mu)}
.bd{background:#eef0ff;color:#3730a3;border-radius:99px;padding:2px 10px;font-size:12px}.bd.z{background:#fee2e2;color:var(--no)}
.tot{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin:10px 0}
.line{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);animation:up .25s both}.line .gr{flex:1}.line button{padding:1px 9px}
#md{position:fixed;inset:0;background:#0f172a80;backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:9;animation:fade .2s}
#md .box{max-width:370px;width:100%;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.fd{width:120px;height:92px;text-align:left;background:#fff;border-radius:16px;font-weight:600;padding:12px;line-height:1.7}.fd.on{outline:2px solid var(--ac);background:#eef0ff}
.ph{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#eef0ff,#f6e8ff);color:#9ca3af}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px}
.emp{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:260px;text-align:center}
#chk{display:flex;flex-direction:column;position:sticky;top:12px;align-self:start;min-height:72vh}#chk .cl{flex:1}
#md.hide,.hide{display:none!important}
#tt{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px #0004;animation:up .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body *{visibility:hidden}#md .box,#md .box *{visibility:visible}#md{position:absolute;background:none;backdrop-filter:none}#md button{display:none}}
</style>
</head>
<body>
<div id="root"></div><div id="md" class="hide"></div><div id="tt" class="hide"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('uk-UA')+' ₴',dt=t=>new Date(t).toLocaleString('uk-UA');
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
let TOK=ls.get('pos_tok'),S=null,view='home',cart=[],method='cash',q='',catF=null,vm='list',onlyIn=false,appr=false,apprCb=null,editId=null,promoPct=0,jf={u:'',t:''},openG={stock:true};
const RL={owner:'Власник',admin:'Адміністратор',deputy:'Заступник адміністратора',cashier:'Касир'};
const can={stock:['owner','admin','deputy'],users:['owner','admin'],reports:['owner','admin','deputy'],cfg:['owner']};
const D0=j=>Object.assign({partners:[],promos:[],expenses:[]},j);
function toast(m){const t=$('#tt');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),3500)}
async function api(p,b){
  const r=await fetch('/api/pos/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOK&&p!=='login'&&p!=='register'){logout();throw new Error('Сесія завершилась, увійдіть знову')}
  if(!r.ok)throw new Error(j.error||'Помилка');return j}
const go=async(p,b)=>{try{return await api(p,b)}catch(e){toast(e.message);return null}};
function logout(){TOK=null;ls.set('pos_tok',null);S=null;cart=[];authV('login')}

/* ---------- вхід / реєстрація ---------- */
function authV(mode){
  const reg=mode==='reg';
  $('#root').innerHTML=`<div class="auth"><div class="logo">З</div><h2 style="margin-top:14px">${reg?'Реєстрація працівника':'Вхід у касу'}</h2><div class="mu">ЗначокUA</div>
  <input id="e" type="email" placeholder="Email" autocomplete="username">
  ${reg?'<input id="o" placeholder="Одноразовий пароль" autocapitalize="characters"><input id="p" type="password" placeholder="Придумайте пароль (від 10 символів)" autocomplete="new-password">':'<input id="p" type="password" placeholder="Пароль" autocomplete="current-password">'}
  <button class="k" id="go">${reg?'Зареєструватися':'Увійти'}</button>
  <p style="text-align:center"><a href="#" id="sw">${reg?'← Назад до входу':'Маєте одноразовий пароль? Реєстрація'}</a></p></div>`;
  $('#sw').onclick=e=>{e.preventDefault();authV(reg?'login':'reg')};
  const run=async()=>{
    const body={email:$('#e').value,password:$('#p').value};if(reg)body.otp=$('#o').value;
    const j=await go(reg?'register':'login',body);if(j){TOK=j.token;ls.set('pos_tok',TOK);boot()}};
  $('#go').onclick=run;$('#root').onkeydown=e=>{if(e.key==='Enter')run()}}

async function boot(){
  if(!TOK)return authV('login');
  try{S=D0(await api('state'))}catch{return authV('login')}
  shell()}
const refresh=async()=>{const j=await go('state');if(j){S=D0(j);draw()}};

/* ---------- каркас ---------- */
const NAV=[['home','Головна','🏠'],['sell','Продаж','🛍'],['hist','Історія чеків','🧾'],
['stock','Склад','📦',[['prod','Товари','stock'],['supply','Постачання','stock'],['make','Виробництво','stock'],['stop','Стоп-листи','stock'],['inv','Інвентаризація','stock'],['log','Історія дій','stock']]],
['orgG','Моя організація','🏪',[['org','Організація','users'],['partners','Партнери','stock'],['promo','Маркетинг','users'],['fin','Фінанси','users']]],
['repG','Звіти','📊',[['rep','Інші звіти','reports'],['pl','P&L','users'],['abc','ABC-аналіз','reports'],['cf','Cashflow','users'],['mv','Звіт по руху','reports']]],
['jr','Журнал дій','📜','users'],
['setG','Налаштування','⚙️',[['set','Загальні'],['pay','Методи оплати','cfg'],['rcp','Чеки','cfg']]]];
const ok=k=>!k||can[k].includes(S.user.role);
function shell(){
  $('#root').innerHTML=`<div id="app"><aside id="side"></aside><main id="main"></main></div>`;draw()}
function draw(){
  const lf=n=>`<button class="nv ${view===n[0]?'on':''}" data-v="${n[0]}"><i>${n[2]}</i>${n[1]}</button>`;
  $('#side').innerHTML=`<div class="top"><div class="logo">З</div>${esc(S.settings.name)}</div>`+NAV.map(n=>{
    if(!(n[3] instanceof Array))return ok(n[3])?lf(n):'';
    const ss=n[3].filter(s=>ok(s[2]));if(!ss.length)return '';
    const on=ss.some(s=>s[0]===view);
    return `<button class="nv ${on&&!openG[n[0]]?'ing':''}" data-g="${n[0]}"><i>${n[2]}</i>${n[1]}<em>${openG[n[0]]?'▴':'▾'}</em></button>`+(openG[n[0]]?`<div class="sub">${ss.map(s=>`<button class="nv ${view===s[0]?'on':''}" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>`:'')}).join('')+
  `<div class="me">${esc(S.user.name)}<br>${RL[S.user.role]}</div>`;
  const V={home,sell,hist,prod,supply:()=>mov('supply','Постачання','Постачання'),make:()=>mov('make','Виробництво','Виробництво'),stop,inv,log:logV,org,partners:partV,promo:promoV,fin:finV,rep,pl:plV,abc:abcV,cf:cfV,mv:mvV,jr:jrV,set,pay:payV,rcp:rcpV};
  $('#main').innerHTML=`<button id="burger" onclick="$('#side').classList.toggle('o')">☰ Меню</button>`+(V[view]||home)();if(view==='sell')sellDraw()}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-v],[data-g],[data-a]');if(!t||!S)return;
  const d=t.dataset;
  if(d.v){view=d.v;$('#side').classList.remove('o');return draw()}
  if(d.g){openG[d.g]=!openG[d.g];return draw()}
  const id=+d.id,A={
    add(){const p=S.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c){if(c.q<p.stock)c.q++}else if(p.stock>0)cart.push({id,q:1});else toast('Немає на складі');sellDraw()},
    inc(){const c=cart[+d.k],p=S.products.find(x=>x.id===c.id);if(c.q<p.stock)c.q++;sellDraw()},
    dec(){askAppr(()=>{const c=cart[+d.k];if(c&&--c.q<1){cart.splice(+d.k,1);if(!cart.length)appr=false}sellDraw()})},
    rm(){askAppr(()=>{cart.splice(+d.k,1);if(!cart.length)appr=false;sellDraw()})},
    clear(){askAppr(()=>{cart=[];appr=false;sellDraw()})},
    async apok(){const j=await go('verify',{password:$('#ap').value,what:'видалення з чека'});if(j){appr=true;$('#md').classList.add('hide');const f=apprCb;apprCb=null;f&&f()}},
    vm(){vm=vm==='list'?'grid':'list';draw()},
    onlyin(){onlyIn=!onlyIn;draw()},
    cat(){catF=catF===d.c?null:d.c;draw()},
    topay(){if(cart.length)payModal()},
    m(){method=d.m;document.querySelectorAll('[data-a=m]').forEach(b=>b.classList.toggle('k',b.dataset.m===method));$('#cashb').classList.toggle('hide',method!=='cash')},
    async pay(){
      if(!cart.length)return toast('Чек порожній');
      const j=await go('sale',{items:cart,disc:$('#dc').value,method,given:$('#gv')?.value,promo:$('#pr')?.value,client:$('#cl').value});
      if(j){S.products=j.products;cart=[];appr=false;receipt(j.sale);await refresh()}},
    rc(){receipt(S.sales.find(s=>s.no===id))},
    async sdel(){if(confirm('Видалити чек №'+id+'? Товари повернуться на склад.')){if(await go('sale/del',{no:id}))refresh()}},
    edit(){editId=id;draw();$('#pn').scrollIntoView?.()},
    async pdel(){if(confirm('Видалити товар?')&&await go('product/del',{id}))refresh()},
    async psave(){
      const j=await go('product',{id:editId,name:$('#pn').value,price:$('#pp').value,stock:$('#ps')?.value,code:$('#pc').value,cat:$('#pcat').value,min:$('#pm').value});
      if(j){editId=null;toast('Збережено');refresh()}},
    pcancel(){editId=null;draw()},
    async mov(){
      const j=await go('stock',{type:d.t,id:+$('#sp').value,qty:$('#sq').value,note:$('#sn').value});
      if(j){toast('Збережено');refresh()}},
    async invsave(){
      for(const i of document.querySelectorAll('[data-inv]'))if(i.value!==''&&+i.value!==+i.dataset.cur)if(!await go('stock',{type:'inv',id:+i.dataset.inv,qty:i.value}))return;
      toast('Інвентаризацію збережено');refresh()},
    async invite(){
      const j=await go('user/invite',{email:$('#ue').value,name:$('#un').value,role:$('#ur').value});
      if(j){modal(`<h3>Працівника створено</h3><p>Передайте працівнику email і цей одноразовий пароль. Він зареєструється на сторінці входу («Маєте одноразовий пароль?»).</p><div style="font:700 24px monospace;text-align:center;margin:14px 0;letter-spacing:2px">${j.otp}</div><p class="mu">Пароль показується один раз.</p><button class="k" style="width:100%" data-a="close">Зрозуміло</button>`);refresh()}},
    async udel(){if(confirm('Видалити працівника '+d.email+'?')&&await go('user/del',{email:d.email}))refresh()},
    async pw(){if(await go('password',{old:$('#po').value,new:$('#pnw').value})){toast('Пароль змінено');$('#po').value=$('#pnw').value=''}},
    async shop(){const j=await go('settings',{name:$('#sn2').value});if(j){S.settings=j.settings;draw();toast('Збережено')}},
    async cadd(){const data={};document.querySelectorAll(`[data-f="${d.c}"]`).forEach(i=>data[i.dataset.k]=i.value);const j=await go('coll',{c:d.c,d:data});if(j){S[d.c]=j.coll;toast('Додано');draw()}},
    async cdel(){if(confirm('Видалити запис?')){const j=await go('coll',{c:d.c,del:1,id});if(j){S[d.c]=j.coll;draw()}}},
    async msave(){const j=await go('settings',{methods:{cash:$('#xc').checked,card:$('#xk').checked}});if(j){S.settings=j.settings;toast('Збережено');draw()}},
    async rsave(){const j=await go('settings',{receipt:{head:$('#rh').value,foot:$('#rf').value,showCashier:$('#rs').checked}});if(j){S.settings=j.settings;toast('Збережено')}},
    csv(){csvOut()},out(){logout()},close(){$('#md').classList.add('hide')}};
  A[d.a]?.()});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;$('#plist').innerHTML=plist()}
  if(e.target.id==='dc'||e.target.id==='gv')calc();
  if(e.target.id==='jq'||e.target.id==='ju'){jf.t=$('#jq').value;jf.u=$('#ju').value;$('#jb').innerHTML=jrRows()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='ju'){jf.u=e.target.value;$('#jb').innerHTML=jrRows()}
  if(e.target.id!=='pr')return;promoPct=0;const c=e.target.value.trim();
  if(c){const j=await go('promo/check',{code:c});if(j){promoPct=j.percent;toast('Промокод діє: −'+j.percent+'%')}else e.target.value=''}
  calc()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ap')return document.querySelector('[data-a=apok]').click();
  if(e.target.id==='q'&&q){const p=S.products.find(x=>x.code&&x.code===q.trim());if(p){e.target.value=q='';$('#plist').innerHTML=plist();document.querySelector(`#plist [data-id="${p.id}"]`)?.click()||0}}});
function modal(h){const m=$('#md');m.innerHTML=`<div class="box">${h}</div>`;m.classList.remove('hide')}
function receipt(s){const R=S.settings.receipt||{};modal(`<div style="text-align:center"><b>${esc(S.settings.name)}</b>${R.head?`<br><small>${esc(R.head)}</small>`:''}<br><small>Чек №${s.no} · ${dt(s.t)}</small></div><hr>
${s.items.map(i=>`<div class="row"><span class="gr">${esc(i.name)} ×${i.q}</span>${money(i.price*i.q)}</div>`).join('')}<hr>
${s.disc?`<div class="row"><span class="gr">Знижка</span>${s.disc}%</div>`:''}<div class="row"><b class="gr">РАЗОМ</b><b>${money(s.sum)}</b></div>
<div class="row"><span class="gr">Оплата</span>${s.method==='cash'?'Готівка':'Картка'}</div>${s.given?`<div class="row"><span class="gr">Решта</span>${money(s.given-s.sum)}</div>`:''}
${R.showCashier!==false?`<div class="row"><span class="gr">Касир</span>${esc(s.byName)}</div>`:''}
<p style="text-align:center">${esc(R.foot??'Дякуємо за покупку! 💛')}</p><div class="row"><button class="gr" onclick="window.print()">🖨 Друк</button><button class="k gr" data-a="close">Готово</button></div>`)}

/* ---------- сторінки ---------- */
const sum=a=>a.reduce((x,s)=>x+s.sum,0);
function salesT(list,acts){return `<div class="box w"><table><tr><th>№</th><th>Час</th><th>Товари</th><th>Оплата</th><th>Хто</th><th>Сума</th><th></th></tr>${list.map(s=>`<tr><td>${s.no}</td><td>${dt(s.t)}</td><td>${s.items.map(i=>esc(i.name)+' ×'+i.q).join(', ')}</td><td>${s.method==='cash'?'Готівка':'Картка'}</td><td>${esc(s.byName)}</td><td><b>${money(s.sum)}</b></td><td><button data-a="rc" data-id="${s.no}">🧾</button>${acts&&['owner','admin'].includes(S.user.role)?` <button class="r" data-a="sdel" data-id="${s.no}">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">Чеків ще немає</td></tr>'}</table></div>`}
function home(){
  const td=new Date().toDateString(),ts=S.sales.filter(s=>new Date(s.t).toDateString()===td),c=(a,v)=>`<div class="card"><span>${a}</span><b>${v}</b></div>`;

const jrRows=()=>{const t=jf.t.toLowerCase();return S.log.filter(x=>(!jf.u||x.u===jf.u)&&(!t||x.a.toLowerCase().includes(t))).map(x=>`<tr><td>${dt(x.t)}</td><td>${esc(x.u)}</td><td>${esc(x.a)}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Нічого не знайдено</td></tr>'};
const jrV=()=>`<h2>Журнал дій</h2><div class="row"><input id="jq" class="gr" placeholder="Пошук по діях" value="${esc(jf.t)}"><select id="ju"><option value="">Усі працівники</option>${[...new Set(S.log.map(x=>x.u))].map(u=>`<option ${jf.u===u?'selected':''}>${esc(u)}</option>`).join('')}</select></div><div class="box w"><table><tr><th>Час</th><th>Хто</th><th>Дія</th></tr><tbody id="jb">${jrRows()}</tbody></table></div>`;
const payV=()=>{const M=S.settings.methods||{cash:true,card:true};return `<h2>Методи оплати</h2><div class="box"><label class="row"><input id="xc" type="checkbox" ${M.cash?'checked':''} style="width:auto"> Готівка</label><label class="row"><input id="xk" type="checkbox" ${M.card?'checked':''} style="width:auto"> Картка</label><button class="k" data-a="msave">Зберегти</button></div>`};
const rcpV=()=>{const R=S.settings.receipt||{};return `<h2>Чеки</h2><div class="box"><div class="row"><span style="width:110px">Шапка чека</span><input id="rh" class="gr" value="${esc(R.head)}" placeholder="Адреса, телефон…"></div><div class="row"><span style="width:110px">Підвал чека</span><input id="rf" class="gr" value="${esc(R.foot??'Дякуємо за покупку! 💛')}"></div><label class="row"><input id="rs" type="checkbox" ${R.showCashier!==false?'checked':''} style="width:auto"> Показувати касира на чеку</label><button class="k" data-a="rsave">Зберегти</button></div>`};
boot();
</script>
</body>
</html>
